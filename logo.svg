<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="jdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c3d" />
      <stop offset="60%" stop-color="#0a3944" />
      <stop offset="100%" stop-color="#052730" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="jdBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51d6df" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#087f8c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c6ef5e" stop-opacity="0.7" />
    </linearGradient>

    <!-- Path / Journey Gradient -->
    <linearGradient id="jdPath" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#51d6df" />
      <stop offset="60%" stop-color="#95e692" />
      <stop offset="100%" stop-color="#c6ef5e" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="jdCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193b4e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0e2330" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="jdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Badge / Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#jdBg)" stroke="url(#jdBorder)" stroke-width="1.5" />

  <!-- Background decorative card tilted (Planning Poker motif) -->
  <rect x="23" y="11" width="26" height="38" rx="5" transform="rotate(12 36 30)" fill="#075b66" fill-opacity="0.3" stroke="#51d6df" stroke-opacity="0.25" stroke-width="1.2" />

  <!-- Front card base -->
  <rect x="15" y="13" width="28" height="38" rx="5" fill="url(#jdCard)" stroke="#51d6df" stroke-opacity="0.45" stroke-width="1.2" />

  <!-- Code Bracket Left: < -->
  <path d="M 19 26 L 12 32 L 19 38" stroke="#51d6df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Bracket Right: > -->
  <path d="M 45 26 L 52 32 L 45 38" stroke="#51d6df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Journey Path (Rising Arrow from bottom-left to top-right) -->
  <path d="M 23 42 Q 28 35 38 23" fill="none" stroke="url(#jdPath)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Arrow Head pointing northeast -->
  <path d="M 31 22 L 39 22 L 39 30" fill="none" stroke="#c6ef5e" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Journey Milestone Nodes -->
  <circle cx="23" cy="42" r="2.2" fill="#51d6df" />
  <circle cx="29.5" cy="33.5" r="2.2" fill="#9fe97a" />
  
  <!-- North Star / Milestone Spark at Destination -->
  <path d="M 44 14 Q 44 17 47 17 Q 44 17 44 20 Q 44 17 41 17 Q 44 17 44 14 Z" fill="#c6ef5e" filter="url(#jdGlow)" />
</svg>
